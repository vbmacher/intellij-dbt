<!doctype html><html><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:;"><style>
:root{--bg:#202124;--panel:#2b2d30;--fg:#dfe1e5;--muted:#a6a9b0;--line:#50535a;--accent:#68a7ee}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:13px system-ui;overflow:hidden}button,input{font:inherit;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:5px 9px}button{cursor:pointer}button:disabled{opacity:.45;cursor:default}button:hover{border-color:var(--accent)}#toolbar{height:42px;display:flex;align-items:center;gap:7px;padding:5px 10px;border-bottom:1px solid var(--line)}#search{width:190px}#status{color:var(--muted);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#main{display:flex;height:calc(100vh - 42px)}#graph-pane{position:relative;flex:1;min-width:80px;overflow:hidden}#cy,#cards{position:absolute;inset:0}#cards{pointer-events:none;overflow:hidden}.card{position:absolute;width:206px;height:80px;border-left:4px solid #6b9be6;border-radius:6px;padding:9px 12px;background:var(--panel);box-shadow:0 2px 6px #0004;transform-origin:center;overflow:hidden;user-select:none}.card.focus{outline:2px solid var(--accent)}.card.selected{box-shadow:0 0 0 2px #ae8bfa}.card.dim{opacity:.18}.card b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:4px 0}.card small{color:var(--muted)}.card[data-kind=source_table]{border-color:#53b8ac}.card[data-kind=seed]{border-color:#c6a55f}.card[data-kind=snapshot]{border-color:#b88adb}.card[data-kind=exposure]{border-color:#dd8d76}.card.boundary{height:44px;text-align:center;border:1px dashed var(--line);box-shadow:none;background:var(--bg)}#empty{position:absolute;top:40%;left:10%;right:10%;text-align:center;color:var(--muted);pointer-events:none}#handle{width:6px;cursor:col-resize;background:var(--line)}#docs{width:360px;min-width:220px;max-width:70vw;display:flex;flex-direction:column;background:var(--panel);overflow:hidden}#doc-head{padding:13px 15px 4px;flex-shrink:0}#doc-head h2{font-size:16px;margin:6px 0;overflow-wrap:anywhere}#close-docs{float:right}#description{white-space:pre-wrap;max-height:100px;overflow:auto;padding:0 15px;flex-shrink:0}#description.expanded{max-height:30vh}#expand-description{align-self:start;margin:6px 15px}#tabs{display:flex;border-bottom:1px solid var(--line);padding:0 8px;flex-shrink:0}#tabs button{border:0;background:none;border-bottom:2px solid transparent;border-radius:0;padding:9px}#tabs button.active{border-color:var(--accent)}#doc-content{overflow:auto;padding:12px 15px;flex:1}table{border-collapse:collapse;width:100%}td,th{text-align:left;vertical-align:top;padding:7px 8px;border-bottom:1px solid var(--line);overflow-wrap:anywhere}th{color:var(--muted)}pre{white-space:pre;overflow:auto;font:12px ui-monospace,monospace;line-height:1.5;padding:10px;background:var(--bg)}.pill{display:inline-block;padding:2px 6px;margin:3px;border:1px solid var(--line);border-radius:10px;font-size:11px}.muted{color:var(--muted)}h3{font-size:13px}#doc-content ul{padding-left:20px}
#tooltip{display:none;position:fixed;z-index:10;max-width:360px;padding:9px 12px;white-space:pre-wrap;pointer-events:none;background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:5px;box-shadow:0 3px 12px #0005}</style></head><body><div id="toolbar"><input id="search" aria-label="Search resources" placeholder="Search resources"><button id="clear-search">Clear search</button><button id="zoom-in" title="Zoom in">+</button><button id="zoom-out" title="Zoom out">−</button><button id="fit">Fit</button><button id="show-docs">Docs</button><span id="status">Loading dbt resources…</span><button id="regenerate">Regenerate Docs</button></div><div id="main"><div id="graph-pane"><div id="cy"></div><div id="cards"></div><div id="empty"></div></div><div id="handle"></div><aside id="docs"><div id="doc-head"><button id="close-docs" aria-label="Close documentation">×</button><div id="doc-kind" class="muted"></div><h2 id="doc-name">Documentation</h2><div id="doc-relation" class="muted"></div><div id="doc-pills"></div></div><div id="description"></div><button id="expand-description">Expand description</button><nav id="tabs"><button data-tab="Columns" class="active">Columns</button><button data-tab="Tests">Tests</button><button data-tab="SQL">SQL</button><button data-tab="Metadata">Metadata</button></nav><div id="doc-content">Select a resource to browse documentation.</div></aside></div>
<div id="tooltip" role="tooltip"></div>
<!-- SCRIPTS -->
<script>
'use strict';
const $=id=>document.getElementById(id),send=(type,id='',value='')=>window.dbtSend&&window.dbtSend(JSON.stringify({type,id,value}));
let cy=null,current=null,doc=null,tab='Columns',selected='',selectedTimer=null,cards=new Map();
const icon={model:'▤',source_table:'⇥',seed:'▦',snapshot:'◷',exposure:'◈'};
function element(tag,text,cls){const e=document.createElement(tag);if(text!==undefined&&text!==null)e.textContent=text;if(cls)e.className=cls;return e}
function displayDocs(visible){$('docs').style.display=visible?'flex':'none';$('handle').style.display=visible?'block':'none';if(cy)cy.resize()}
function positions(){if(!cy)return;for(const n of cy.nodes()){const el=cards.get(n.id());if(!el)continue;const p=n.renderedPosition(),z=cy.zoom();el.style.left=p.x+'px';el.style.top=p.y+'px';el.style.transform=`translate(-50%,-50%) scale(${z})`;}}
function select(id){selected=id;doc=null;$('doc-name').textContent='Loading documentation…';$('doc-kind').textContent='';$('description').textContent='';$('doc-relation').textContent='';$('doc-pills').replaceChildren();$('doc-content').textContent='';displayDocs(true);send('select',id);dim(id)}
function dim(id){if(!cy)return;cy.elements().removeClass('dim');for(const c of cards.values())c.classList.remove('dim','selected');const n=cy.getElementById(id);if(n.empty())return;const keep=n.union(n.predecessors()).union(n.successors());cy.elements().difference(keep).addClass('dim');for(const x of cy.nodes()){const c=cards.get(x.id());if(c){c.classList.toggle('dim',!keep.contains(x));c.classList.toggle('selected',x.id()===id)}}}
function styleEdges(edgeStyle){return [{selector:'node',style:{width:210,height:84,shape:'round-rectangle','background-opacity':0,'border-width':0,label:''}},{selector:'node.boundary',style:{width:206,height:44}},{selector:'edge',style:{'curve-style':edgeStyle,'taxi-direction':'auto','taxi-turn':40,'taxi-turn-min-distance':20,'source-endpoint':'outside-to-node','target-endpoint':'outside-to-node','line-color':'#697484','target-arrow-color':'#697484','target-arrow-shape':'triangle','arrow-scale':.8,width:1.5,'control-point-step-size':36}},{selector:'.dim',style:{opacity:.15}},{selector:'edge[candidate]',style:{'line-style':'dashed'}}]}
window.dbtUpdate=function(p){
 $('tooltip').style.display='none';const old=current,same=!!old&&old.focus===p.focus,zoom=cy&&cy.zoom(),pan=cy&&cy.pan(),oldPositions=new Map();if(cy)cy.nodes().forEach(n=>oldPositions.set(n.id(),n.position()));current=p;
 if(p.theme)for(const[k,v]of Object.entries(p.theme))document.documentElement.style.setProperty('--'+k,v);
 $('status').textContent=p.status||'';$('regenerate').disabled=!!p.running;$('empty').textContent=p.empty||'';
 displayDocs(p.docsVisible!==false);$('docs').style.width=(p.docsWidth||360)+'px';
 const nodes=p.nodes.map(n=>({data:{...n},classes:n.boundary?'boundary':''})),edges=p.edges.map((e,i)=>({data:{id:'edge:'+i,...e,...(!e.candidate?{candidate:undefined}:{candidate:1})}}));
 for(const b of p.boundary||[]){const id='boundary:'+b.direction;nodes.push({data:{id,name:'+ '+b.count+' more',boundary:b.direction},classes:'boundary'});for(const a of b.anchors)edges.push({data:{id:id+':'+a,source:b.direction==='upstream'?id:a,target:b.direction==='upstream'?a:id}})}
 if(!cy){cy=cytoscape({container:$('cy'),elements:[],style:styleEdges(p.edgeStyle),minZoom:.15,maxZoom:2.5,wheelSensitivity:.15,boxSelectionEnabled:false});
 cy.on('render pan zoom position',positions);
 cy.on('mouseover','node',e=>{const d=e.target.data();if(d.boundary)return;const tip=$('tooltip'),p=e.target.renderedPosition(),r=$('cy').getBoundingClientRect();tip.textContent=[d.package+'.'+d.name,d.kind+' '+(d.materialized||''),d.schema,d.description].filter(Boolean).join('\n');tip.style.left=Math.min(innerWidth-370,r.x+p.x+25)+'px';tip.style.top=Math.max(45,r.y+p.y+45)+'px';tip.style.display='block'});
 cy.on('mouseout mousedown drag pan zoom',()=>{$('tooltip').style.display='none'});cy.on('tap','node',e=>{const n=e.target;if(n.data('boundary'))send('expand',n.data('boundary'));else{clearTimeout(selectedTimer);selectedTimer=setTimeout(()=>select(n.id()),180)}});
 cy.on('dbltap','node',e=>{clearTimeout(selectedTimer);if(!e.target.data('boundary'))send('focus',e.target.id())});cy.on('tap',e=>{if(e.target===cy){selected='';dim('')}});
 }
 cy.elements().remove();cy.add([...nodes,...edges]);cy.style(styleEdges(p.edgeStyle));
 $('cards').replaceChildren();cards=new Map();for(const n of cy.nodes()){
 const d=n.data(),card=element('div',null,'card'+(d.focus?' focus':'')+(d.boundary?' boundary':''));card.dataset.kind=d.kind||'';
 card.title=[d.package,d.kind,d.materialized,d.schema,d.description,d.candidate?'Ambiguous candidate':''].filter(Boolean).join('\n');
 if(d.boundary)card.append(element('b',d.name));else{card.append(element('small',(icon[d.kind]||'▤')+' '+(d.materialized||(d.kind==='source_table'?'source':d.kind))),element('b',d.name+(d.candidate?' ?':'')),element('small',d.schema||d.package));}
 $('cards').append(card);cards.set(n.id(),card);
 }
 const topologyChanged=!old||JSON.stringify(old.nodes.map(n=>n.id))!==JSON.stringify(p.nodes.map(n=>n.id))||old.direction!==p.direction;
 if(!same||topologyChanged)cy.layout({name:'dagre',rankDir:p.direction||'LR',nodeSep:35,rankSep:80,padding:35,animate:false,fit:!same}).run();
 else cy.nodes().forEach(n=>{if(oldPositions.has(n.id()))n.position(oldPositions.get(n.id()))});
 if(same&&pan){cy.zoom(zoom);cy.pan(pan)}else cy.fit(undefined,35);
 if(!same){selected=p.focus;doc=null;if(p.focus)select(p.focus);else{$('doc-name').textContent='Documentation';$('doc-kind').textContent='';$('doc-relation').textContent='';$('description').textContent='';$('doc-pills').replaceChildren();$('doc-content').textContent='Select a resource to browse documentation.'}}else if(selected){dim(selected);send('select',selected)}
 positions();
};
window.dbtShowDoc=function(id,data){if(id!==selected)return;doc=data;$('doc-name').textContent=data.name;$('doc-kind').textContent=(icon[data.kind]||'▤')+' '+(data.kind==='source_table'?'source':data.kind)+' · '+data.logical;$('doc-relation').textContent=data.attributes.relation_name||data.attributes.schema||'';$('description').textContent=data.description||'No description documented.';$('doc-pills').replaceChildren();for(const s of [...data.tags,data.attributes.materialized,(data.tests.length+' test declarations')].filter(Boolean))$('doc-pills').append(element('span',s,'pill'));renderTab()};
function renderTab(){if(!doc)return;const out=$('doc-content');out.replaceChildren();for(const b of $('tabs').children)b.classList.toggle('active',b.dataset.tab===tab);
 function para(text){out.append(element('p',text,'muted'))}function heading(text){out.append(element('h3',text))}function list(values){const ul=element('ul');for(const v of values)ul.append(element('li',v));out.append(ul)}function table(headers,rows){const t=element('table'),head=element('tr');headers.forEach(h=>head.append(element('th',h)));t.append(head);for(const r of rows){const tr=element('tr');r.forEach(v=>tr.append(element('td',v)));t.append(tr)}out.append(t)}
 if(tab==='Columns'){if(!doc.columns.length)para('No columns documented for this resource.');else table(['Column','Type','Description / declarations'],doc.columns.map(c=>[c.name,c.type,c.description+(c.declarations.length?'\nDeclared: '+c.declarations.join(', '):'')]));para('Constraints and tests are declarations; warehouse enforcement and passing results are not inferred.');}
 else if(tab==='Tests'){heading(doc.tests.length+' test declarations');if(!doc.tests.length)para('No attached tests documented.');else table(['Test','Column'],doc.tests.map(t=>[t.name,t.column]));para('Declarations only; no execution results are available here.');}
 else if(tab==='SQL'){heading('Raw model SQL');if(doc.rawSql)out.append(element('pre',doc.rawSql));else para('Raw SQL unavailable for this resource.');heading('Compiled SQL');if(doc.compiledSql)out.append(element('pre',doc.compiledSql));else para('Compiled SQL unavailable. Generate Docs or Compile for the selected target.');}
 else{table(['Property','Value'],[['Source',doc.source],['Logical identity',doc.logical],...Object.entries(doc.attributes)]);heading('Description');para(doc.description||'Not documented');heading('Upstream ('+doc.upstream.length+')');list(doc.upstream);heading('Downstream ('+doc.downstream.length+')');list(doc.downstream)}
}
$('tabs').onclick=e=>{if(e.target.dataset.tab){tab=e.target.dataset.tab;renderTab()}};
$('expand-description').onclick=()=>{const expanded=$('description').classList.toggle('expanded');$('expand-description').textContent=expanded?'Collapse description':'Expand description'};
$('close-docs').onclick=()=>{displayDocs(false);send('docs','','false')};$('show-docs').onclick=()=>{displayDocs(true);send('docs','','true')};
$('fit').onclick=()=>cy&&cy.fit(undefined,35);$('zoom-in').onclick=()=>cy&&cy.zoom(cy.zoom()*1.2);$('zoom-out').onclick=()=>cy&&cy.zoom(cy.zoom()/1.2);
$('clear-search').onclick=()=>{$('search').value='';dim(selected)};$('search').oninput=()=>{if(!cy)return;const q=$('search').value.toLowerCase();if(!q){dim(selected);return}const matches=cy.nodes().filter(n=>!n.data('boundary')&&(n.data('name')+' '+n.data('package')).toLowerCase().includes(q));cy.elements().addClass('dim');matches.removeClass('dim');for(const n of cy.nodes())cards.get(n.id()).classList.toggle('dim',!matches.contains(n));if(matches.length)cy.fit(matches,70)};
$('regenerate').onclick=()=>send('regenerate');let resizing=false;$('handle').onpointerdown=e=>{resizing=true;$('handle').setPointerCapture(e.pointerId)};$('handle').onpointermove=e=>{if(resizing){const width=Math.max(220,Math.min(innerWidth*.7,innerWidth-e.clientX));$('docs').style.width=width+'px';if(cy)cy.resize()}};$('handle').onpointerup=()=>{resizing=false;send('width','',String(Math.round($('docs').getBoundingClientRect().width)))};
window.dbtRunnerState=(running,message)=>{$('regenerate').disabled=running;$('status').textContent=message};window.addEventListener('resize',()=>{if(cy){cy.resize();positions()}});send('ready');
</script></body></html>
