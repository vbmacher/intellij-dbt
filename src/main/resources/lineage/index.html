// Automatic framing keeps labels readable. Fit graph remains an explicit overview.

 for(const n of cy.nodes().filter(n=>n.data('group'))){const b=n.boundingBox();result+='<rect x="'+b.x1+'" y="'+b.y1+'" width="'+b.w+'" height="'+b.h+'" fill="'+color('panel')+'" stroke="'+color('muted')+'" stroke-dasharray="6 4"/><text x="'+(b.x1+8)+'" y="'+(b.y1+18)+'" font-size="14">'+escape(n.data('name'))+'</text>'}
 for(const e of cy.edges()){const a=e.sourceEndpoint()||e.source().position(),b=e.targetEndpoint()||e.target().position(),segments=e.segmentPoints()||[],controls=e.controlPoints()||[];let d='M'+a.x+' '+a.y;if(segments.length)for(const p of segments)d+=' L'+p.x+' '+p.y;else if(controls.length)controls.forEach((c,i)=>{const next=controls[i+1],end=next?{x:(c.x+next.x)/2,y:(c.y+next.y)/2}:b;d+=' Q'+c.x+' '+c.y+' '+end.x+' '+end.y});if(!controls.length||segments.length)d+=' L'+b.x+' '+b.y;result+='<path d="'+d+'" fill="none" stroke="#697484" stroke-width="1.5" marker-end="url(#arrow)" '+(e.data('candidate')?'stroke-dasharray="6 4"':'')+' opacity="'+(e.hasClass('dim')?.15:1)+'"/>'}

async function exportGraph(format){

 send('export',format,data);status.textContent=format==='clipboard'?'Image sent to clipboard':'Image ready to save';
 }catch(e){status.textContent='Image export failed: '+e.message}
}
window.dbtUpdate=function(p){

 if(p.icons)for(const[id,src]of Object.entries(p.icons)){const image=element('img');image.src=src;image.alt='';if($(id)?.classList.contains('tool-button'))$(id).replaceChildren(image)}

 for(const n of nodes.filter(n=>!n.data.boundary&&!n.data.group&&!n.data.collapsed).sort((a,b)=>a.data.name.localeCompare(b.data.name))){const option=element('option',n.data.name+' · '+n.data.kind+' · '+n.data.package);option.value=n.data.id;picker.append(option)}picker.value=selected;
 if(!cy){cy=cytoscape({container:$('cy'),elements:[],style:styleEdges(),minZoom:.01,maxZoom:2.5,boxSelectionEnabled:false});
 cy.on('render pan zoom position',positions);
 cy.on('tap','node',e=>{const n=e.target;if(n.data('boundary'))send('expand',n.data('boundary'));else if(n.data('group')||n.data('collapsed'))toggleGroup(n.id());else{clearTimeout(selectedTimer);selectedTimer=setTimeout(()=>select(n.id()),180)}});
 cy.on('dbltap','node',e=>{clearTimeout(selectedTimer);if(!e.target.data('boundary')&&!e.target.data('group')&&!e.target.data('collapsed'))send('focus',e.target.id())});cy.on('tap',e=>{if(e.target===cy){selected='';selectionContext();dim('')}});
 }
 cy.elements().remove();cy.add([...nodes,...edges]);cy.style(styleEdges());cy.resize();
 $('cards').replaceChildren();cards=new Map();for(const n of cy.nodes()){
 const d=n.data();if(d.group)continue;const card=element('div',null,'card'+(d.focus?' focus':'')+(d.boundary?' boundary':'')+(d.filteredBoundary?' filtered-boundary':'')+(d.collapsed?' collapsed':'')+(hasExecution(d)?' has-execution':''));card.dataset.kind=d.kind||'';
 if(d.boundary)card.append(element('b',d.name));else if(d.collapsed){card.append(element('small','Collapsed group'),element('b',d.name),element('small',d.count+' resources · click to expand'))}else{card.append(element('small',(icon[d.kind]||'▤')+' '+((d.kind==='source_table'?'source':d.kind)+(materialization(d)?' · '+materialization(d):''))),element('b',d.name+(d.candidate?' ?':'')),element('small',(d.filteredBoundary?'Filtered boundary · ':'')+(meaningful(d.schema)||d.package||'')));}
 if(hasExecution(d)&&!d.boundary&&!d.collapsed){const label=executionLabel(d.execution),badge=element('button',label,'execution-badge');badge.dataset.status=d.execution.status;badge.setAttribute('aria-label',d.name+': '+label+'; '+d.execution.details);badge.title=d.execution.details;badge.onclick=e=>{e.stopPropagation();select(n.id(),false);send('execution',n.id())};card.append(badge)}
