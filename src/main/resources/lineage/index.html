 card.title=[d.package,d.kind,d.materialized,d.schema,d.description,d.candidate?'Ambiguous candidate':''].filter(Boolean).join('\n');
 if(d.boundary)card.append(element('b',d.name));else if(d.collapsed){card.append(element('small','Collapsed group'),element('b',d.name),element('small',d.count+' resources · click to expand'))}else{card.append(element('small',(icon[d.kind]||'▤')+' '+(d.materialized||(d.kind==='source_table'?'source':d.kind))),element('b',d.name+(d.candidate?' ?':'')),element('small',(d.filteredBoundary?'Filtered boundary · ':'')+(d.schema||d.package)));}
 if(d.execution&&!d.boundary&&!d.collapsed){const label=executionLabel(d.execution),badge=element('button',label,'execution-badge');badge.dataset.status=d.execution.status;badge.setAttribute('aria-label',d.name+': '+label+'; '+d.execution.details);badge.title=d.execution.details;badge.onclick=e=>{e.stopPropagation();if(d.execution.failingTests>0)tab='Tests';select(n.id());send('execution',n.id())};card.append(badge)}

 }
 const topologyChanged=p.relayout||!old||JSON.stringify(old.nodes.map(n=>n.id))!==JSON.stringify(p.nodes.map(n=>n.id))||old.direction!==p.direction;
 if(!same||topologyChanged)cy.layout({name:'dagre',rankDir:p.direction||'LR',nodeSep:35,rankSep:80,padding:35,animate:false,fit:!same}).run();

window.dbtShowDoc=function(id,data){if(id!==selected)return;doc=data;$('doc-name').textContent=data.name;$('doc-kind').textContent=(icon[data.kind]||'▤')+' '+(data.kind==='source_table'?'source':data.kind)+' · '+data.logical;$('doc-relation').textContent=data.attributes.relation_name||data.attributes.schema||'';$('description').textContent=data.description||'No description documented.';$('doc-pills').replaceChildren();for(const s of [...data.tags,data.attributes.materialized,(data.tests.length+' test declarations')].filter(Boolean))$('doc-pills').append(element('span',s,'pill'));$('edit-docs').disabled=!data.editable;renderTab()};
function renderTab(){if(!doc)return;const out=$('doc-content');out.replaceChildren();for(const b of $('tabs').children)b.classList.toggle('active',b.dataset.tab===tab);
 function para(text){out.append(element('p',text,'muted'))}function heading(text){out.append(element('h3',text))}function list(values){const ul=element('ul');for(const v of values)ul.append(element('li',v));out.append(ul)}function table(headers,rows){const t=element('table'),head=element('tr');headers.forEach(h=>head.append(element('th',h)));t.append(head);for(const r of rows){const tr=element('tr');r.forEach(v=>tr.append(element('td',v)));t.append(tr)}out.append(t)}
 if(tab==='Columns'){if(!doc.columns.length)para('No columns documented for this resource.');else {table(['Column','Type','Description / declarations'],doc.columns.map(c=>[c.name,c.type,c.description+(c.declarations.length?'\nDeclared: '+c.declarations.join(', '):'')]));out.querySelectorAll('tr').forEach((row,i)=>{if(i){const column=doc.columns[i-1],button=element('button',column.name),declaration=element('button','Open declaration');button.onclick=()=>send('column',selected,column.name);declaration.onclick=()=>send('declaration',selected,column.name);declaration.style.fontSize='11px';row.firstChild.replaceChildren(button,element('br'),declaration);for(const[originIndex,origin]of(column.origins||[]).entries()){const details=[origin.kind,origin.direct?'direct passthrough':'derived',origin.complete?'':'partial analysis',origin.expression].filter(Boolean).join(' · '),open=element('button',origin.resource+'.'+origin.column+' · '+details);open.className='column-origin';open.setAttribute('aria-label','Open origin '+origin.resource+'.'+origin.column+'; '+details);open.onclick=()=>send('origin',selected,JSON.stringify({column:column.name,index:originIndex}));row.lastChild.append(element('br'),open)}}});const paths=element('pre','Select a column to trace proven upstream and downstream paths.');paths.id='column-paths';out.append(paths)};para('Constraints and tests are declarations; warehouse enforcement and passing results are not inferred.');}
 else if(tab==='Tests'){heading(doc.tests.length+' test declarations');if(!doc.tests.length)para('No attached tests documented.');else table(['Test','Column'],doc.tests.map(t=>[t.name,t.column]));para('Declarations only; no execution results are available here.');}
 else if(tab==='SQL'){heading('Raw model SQL');if(doc.rawSql)out.append(element('pre',doc.rawSql));else para('Raw SQL unavailable for this resource.');heading('Compiled SQL');if(doc.compiledSql)out.append(element('pre',doc.compiledSql));else para('Compiled SQL unavailable. Generate Docs or Compile for the selected target.');}
 else{table(['Property','Value'],[['Source',doc.source],['Logical identity',doc.logical],...Object.entries(doc.attributes)]);heading('Description');para(doc.description||'Not documented');heading('Upstream ('+doc.upstream.length+')');list(doc.upstream);heading('Downstream ('+doc.downstream.length+')');list(doc.downstream)}
}
for(const button of document.querySelectorAll('button')){
 button.dataset.tooltip=button.title||button.getAttribute('aria-label')||button.textContent.trim();button.removeAttribute('title');
 const hide=()=>{$('button-tooltip').style.display='none';button.removeAttribute('aria-describedby')};
 const show=()=>{if(button.disabled)return;const tip=$('button-tooltip'),rect=button.getBoundingClientRect();tip.textContent=button.dataset.tooltip;tip.style.display='block';tip.style.left=Math.max(8,Math.min(rect.left,innerWidth-tip.offsetWidth-8))+'px';tip.style.top=Math.max(8,Math.min(rect.bottom+6,innerHeight-tip.offsetHeight-8))+'px';button.setAttribute('aria-describedby','button-tooltip')};
 button.addEventListener('pointerenter',show);button.addEventListener('pointerleave',hide);button.addEventListener('focus',show);button.addEventListener('blur',hide);button.addEventListener('pointerdown',hide);button.addEventListener('click',hide);
}

$('clear-filter').onclick=()=>{$('selector').value='';$('exclude').value='';filter=null;window.dbtUpdate({...current,relayout:true});send('filter','','',true)};

$('clear-search').onclick=()=>{$('search').value='';dim(selected)};$('search').oninput=()=>{if(!cy)return;const q=$('search').value.toLowerCase();if(!q){dim(selected);return}const matches=cy.nodes().filter(n=>!n.data('boundary')&&(n.data('name')+' '+n.data('package')).toLowerCase().includes(q));cy.elements().addClass('dim');matches.removeClass('dim');for(const n of cy.nodes())cards.get(n.id())?.classList.toggle('dim',!matches.contains(n));if(matches.length)cy.fit(matches,70)};
