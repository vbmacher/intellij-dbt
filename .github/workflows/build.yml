name: Build for intellij-dbt

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4

      - name: Check bundled offline schemas
        run: python3 tools/bundle_yaml_schemas.py --check

      - name: Test and package
        run: ./gradlew --no-daemon test testPackaged buildPlugin verifyPlugin

  lineage-browser:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/test/js
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/test/js/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test

  python-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Test with the Python Community plugin matching the SDK
        run: ./gradlew --no-daemon testPython
